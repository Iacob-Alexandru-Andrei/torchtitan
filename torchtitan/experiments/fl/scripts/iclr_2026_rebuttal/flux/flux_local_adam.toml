[job]
dump_folder = "./outputs"
description = "Flux-schnell baseline via FL stack"
print_args = false

[profiling]
enable_profiling = false
save_traces_folder = "profile_trace"
profile_freq = 100
enable_memory_snapshot = false
save_memory_snapshot_folder = "memory_snapshot"

[metrics]
log_freq = 1
disable_color_printing = false
enable_tensorboard = false
save_tb_folder = "tb"
enable_wandb = true
save_for_all_ranks = true

[model]
name = "flux"
flavor = "flux-debug"

[optimizer]
name = "DecoupledAdamW"
lr = 1e-4
eps = 1e-8
betas = [0.9, 0.999]


[optimizer.desloc]
enabled = true
param_sync_every = 32
optimizer_sync_every = 32
backup_device = "cpu"
pin_memory = true

[fl_metrics.optimizer_monitor]
interval = 16
only_global = false
log_metrics = true

[fl_metrics.activation_monitor]
interval = 16
ignore_module_types = ["dropout", "ln"]

[fl_metrics.lr_monitor]
enabled = true
interval = 16

[fl_metrics.betas_monitor]
enabled = true
interval = 16

[fl_metrics.vs_monitor]
enabled = true
interval = 16

[lr_scheduler]
warmup_steps = 512  # lr scheduler warm up, normally 20% of the train steps
decay_ratio = 0.0  # lr scheduler decay ratio, 80% of the train steps
decay_type = "sqrt"
min_lr_factor = 0.0
switch_step = 2049
switch_scale = 1.0

[fl_metrics.hyperparameter_switch]
enabled = false
steps = [2049]
new_vs = [0.05, 0.95]
new_betas = [0.9,0.999, 0.999]
reset_momenta = ["exp_avg","exp_avg_2"]

[training]
local_batch_size = 64
max_norm = 0.5
steps = 5120
dataset = "cc12m-wds"
classifier_free_guidance_prob = 0.447
img_size = 256

[encoder]
t5_encoder = "google/t5-v1_1-xxl"
clip_encoder = "openai/clip-vit-large-patch14"
max_t5_encoding_len = 256
autoencoder_path = "torchtitan/experiments/flux/assets/autoencoder/ae.safetensors"

[parallelism]
data_parallel_replicate_degree = 1
data_parallel_shard_degree = -1

[experimental]
custom_args_module = "torchtitan.experiments.flux.job_config"

[activation_checkpoint]
mode = "full"

[checkpoint]
enable = true
keep_latest_k = 20
folder = "checkpoints"
interval = 512
last_save_model_only = false
export_dtype = "float32"
async_mode = "async_with_pinned_mem"  # ["disabled", "async", "async_with_pinned_mem"]

[s3_checkpoint]
enable = true
bucket = "checkpoints"
prefix = ""  # Root of bucket
download_on_start = true
resume_from_run_step = "flux-ddp-20251202-111337/step-512"
# run_uuid and remote_checkpoint_folder will be set via RUN_UUID environment variable

[fault_tolerance]
enable = true
process_group = "gloo"
process_group_timeout_ms = 999999
replica_id = 0
group_size = 2
min_replica_size = 2
sync_steps = 32
semi_sync_method = "desloc"  # Options: "diloco", "local_sgd", or comment out for async quorum

[validation]
enable = false
dataset = "coco-validation"
local_batch_size = 64
steps = 6
freq = 1000
enable_classifier_free_guidance = true
classifier_free_guidance_scale = 5.0
denoising_steps = 50
save_img_count = 50
save_img_folder = "img"
all_timesteps = false

