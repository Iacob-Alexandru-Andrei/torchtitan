[job]
dump_folder = "./outputs"
description = "Flux-schnell DES-LOC (param sync 32, optimizer state sync disabled)"
print_args = false

[profiling]
enable_profiling = false
save_traces_folder = "profile_trace"
profile_freq = 100
enable_memory_snapshot = false
save_memory_snapshot_folder = "memory_snapshot"

[metrics]
log_freq = 100
disable_color_printing = false
enable_tensorboard = false
save_tb_folder = "tb"
enable_wandb = false
save_for_all_ranks = true

[model]
name = "flux"
flavor = "flux-schnell"

[optimizer]
name = "AdamW"
lr = 1e-4
eps = 1e-8

[optimizer.desloc]
enabled = true
param_sync_every = 32
disable_optimizer_state_sync = true

[lr_scheduler]
warmup_steps = 3_000
decay_ratio = 0.0

[training]
local_batch_size = 64
max_norm = 1.0
steps = 30_000
dataset = "cc12m-wds"
classifier_free_guidance_prob = 0.447
img_size = 256

[encoder]
t5_encoder = "google/t5-v1_1-xxl"
clip_encoder = "openai/clip-vit-large-patch14"
max_t5_encoding_len = 256
autoencoder_path = "torchtitan/experiments/flux/assets/autoencoder/ae.safetensors"

[parallelism]
data_parallel_replicate_degree = 1
data_parallel_shard_degree = -1

[experimental]
custom_args_module = "torchtitan.experiments.flux.job_config"

[activation_checkpoint]
mode = "full"

[checkpoint]
enable = false
folder = "checkpoint"
interval = 1_000
last_save_model_only = true
export_dtype = "float32"
async_mode = "disabled"

[fault_tolerance]
enable = true
process_group = "gloo"
process_group_timeout_ms = 999999
replica_id = 0
group_size = 2
min_replica_size = 2
sync_steps = 32
semi_sync_method = "desloc"

[validation]
enable = false
dataset = "coco-validation"
local_batch_size = 64
steps = 6
freq = 1000
enable_classifier_free_guidance = true
classifier_free_guidance_scale = 5.0
denoising_steps = 50
save_img_count = 50
save_img_folder = "img"
all_timesteps = false

