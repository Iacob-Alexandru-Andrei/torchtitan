[job]
dump_folder = "./outputs"
description = "Eval-only perplexity run"
print_args = true

[profiling]
enable_profiling = false
enable_memory_snapshot = false

[metrics]
log_freq = 1
disable_color_printing = false
enable_tensorboard = false
save_tb_folder = "tb"
enable_wandb = false
save_for_all_ranks = false

[model]
name = "mosaic_llama3_mup"
flavor = "16M"
hf_assets_path = "./tests/assets/tokenizer"

[optimizer]
name = "AdamW"
lr = 1e-4
beta1 = 0.9
beta2 = 0.95
eps = 1e-8
weight_decay = 0.0
implementation = "for-loop"

[lr_scheduler]
warmup_steps = 1
decay_ratio = 0.0
decay_type = "linear"
min_lr_factor = 1.0

[training]
local_batch_size = 1
global_batch_size = 1
seq_len = 2048
steps = 1
dataset = "c4_test"

[parallelism]
data_parallel_replicate_degree = 1
data_parallel_shard_degree = -1
tensor_parallel_degree = 1
pipeline_parallel_degree = 1
context_parallel_degree = 1

[checkpoint]
enable = true
folder = "checkpoints"
keep_latest_k = 2
load_step = 0
export_dtype = "float32"
interval = 1

[s3_checkpoint]
enable = true
bucket = "checkpoints"
prefix = ""
download_on_start = true
resume_from_run_step = ""

[activation_checkpoint]
mode = "none"

[validation]
enable = true
dataset = "c4_validation"
local_batch_size = 4
seq_len = 2048
freq = 1
steps = 32

[mosaic_tokenizer]
name = "HuggingFaceTB/SmolLM-1.7B"

[mosaic_tokenizer.kwargs]
model_max_length = 2048

[mosaic_dataloader]
name = "text"
num_workers = 0
pin_memory = true
persistent_workers = false
isolate_grouped_streams = true

[mosaic_dataloader.dataset.common]
max_seq_len = 2048
download_retry = 2
download_timeout = 60
keep_zip = false
partition_algo = "relaxed"
shuffle = false
shuffle_algo = "py1e"
shuffle_seed = 9176
sampling_method = "balanced"
sampling_granularity = 1
batching_method = "random"

[mosaic_dataloader.dataset.train]
split = "train"
root_remote = "s3://smollm-corpus/shared"
root_local = "/home/ubuntu/nfs-share/datasets/photon/dataset_cache/smollm-corpus-shared"
sampling_groups_mode = "grouped"

[mosaic_dataloader.dataset.train.streams.client_streams.stream_0]
local = "fineweb_edu_dedup/client_0"
remote = "fineweb_edu_dedup/client_0"
proportion = 1

[mosaic_dataloader.dataset.val]
split = "validation"
root_remote = "s3://smollm-corpus/shared"
root_local = "/home/ubuntu/nfs-share/datasets/photon/dataset_cache/smollm-corpus-shared"

[mosaic_dataloader.dataset.val.streams.client_streams.stream_0]
local = "fineweb_edu_dedup/client_0"
remote = "fineweb_edu_dedup/client_0"
proportion = 1
